<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS — Notification Command Center</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="scanner"><div class="retina"></div></div>
    <div class="bootText">JARVIS INITIALIZING</div>
  </div>

  <main id="app" class="hidden">
    <header>
      <div>
        <div class="eyebrow">PERSONAL AI COMMAND CENTER</div>
        <h1>JARVIS</h1>
        <p>Android Notification Bridge Online</p>
      </div>
      <button id="logout">LOCK</button>
    </header>

    <section id="login" class="panel">
      <h2>Security Gate</h2>
      <input id="password" type="password" placeholder="Enter password">
      <button id="loginBtn">UNLOCK JARVIS</button>
      <p id="loginStatus"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="grid">
        <div class="panel">
          <h2>Notification Monitor</h2>
          <div class="status"><span id="bridgeDot"></span><span id="bridgeStatus">Checking bridge…</span></div>
          <div class="toolbar">
            <select id="appFilter">
              <option value="">All apps</option>
              <option>WhatsApp</option>
              <option>Telegram</option>
              <option>Gmail</option>
              <option>Messages</option>
              <option>Instagram</option>
            </select>
            <button id="refresh">REFRESH</button>
            <button id="clear">CLEAR</button>
          </div>
          <div id="notifications" class="notifications"></div>
        </div>

        <div class="panel chat">
          <h2>Ask JARVIS</h2>
          <div id="chatLog"></div>
          <div class="chatInput">
            <input id="message" placeholder="যেমন: আজ WhatsApp-এ কে আমাকে মেসেজ করেছে?">
            <button id="send">SEND</button>
          </div>
        </div>
      </div>
    </section>
  </main>

<script src="/js/app.js"></script>
</body>
</html>
